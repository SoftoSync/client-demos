<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>PDF link verification</title>
<script>
(function () {
  var query = new URLSearchParams(location.search);
  if (query.has("status")) {
    document.title = "PDF_STATUS_" + query.get("status");
    window.addEventListener("DOMContentLoaded", function () {
      document.body.textContent = "PDF_STATUS_" + query.get("status");
    });
    return;
  }
  fetch("proposal.pdf", { method: "HEAD", cache: "no-store" })
    .then(function (response) {
      location.replace(location.pathname + "?status=" + response.status);
    })
    .catch(function () {
      location.replace(location.pathname + "?status=fetch-error");
    });
})();
</script>
</head>
<body>Checking proposal PDF link...</body>
</html>
